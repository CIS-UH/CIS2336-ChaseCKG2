<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <script> "src= script.js" </script>
</head>
<body>
      <div class="topnav">
        <a href="index.html">Home</a>
        <a href="news.html">News</a>
        <a class="active" href="contact.html">Contact</a>
    </div>
    <main class="contact-page">
        <header class="contact-header">
            <p class="eyebrow">We would love to hear from you</p>
            <h1>Get In Touch</h1>
            <p>Tell us about your travel interests and how we can reach you.</p>
        </header>

        <form method="post">

            <div class="form-field">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-field">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-field">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-field">
                <label for="rate">Rate this website! (1-10):</label>
                <input type="number" id="rate" name="rate" min="1" max="10">
            </div>

            <label class="check-field" for="newsletter">
                <input type="checkbox" id="newsletter" name="newsletter">
                Subscribe to Newsletter
            </label>

            <fieldset>
                <legend>Preferred Contact Method:</legend>
                <label for="contact_email">
                    <input type="radio" id="contact_email" name="contact_method" value="email">
                    Email
                </label>
                <label for="contact_phone">
                    <input type="radio" id="contact_phone" name="contact_method" value="phone">
                    Phone
                </label>
            </fieldset>

            <button type="submit">Submit</button>
            <br>
            <!--inline javascript-->
            <button onclick="alert('Hi, thanks for signing up!')">submit -alert message</button>
            <button onclick="prompt('Please verify your email address:')">Submit-prompt message</button>
            <button onclick="confirm('Submit the form now?')">Submit -- Confirm Message</button>
            <br>
            <button onclikc="myFunc()">Submit -- External JavaScript</button>
        </form>

        <!--Embedded Javascript-->
        <h2>Print the square of numbers from 1 to 10:</h2>
        <script>
            for(let i = 1; i<=10; i++){
                document.write(i*i + "<br>");
                console.log(i); //
            }
        </script>

    </main>
</body>
</html>
